<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#060813" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="emblemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5" />

  <!-- Iconic Pure Violet Square Glyph (1:1 with Landing Page Brand Emblem) -->
  <rect x="20" y="20" width="24" height="24" rx="4.5" fill="url(#glyphGrad)" filter="url(#emblemGlow)" />
</svg>